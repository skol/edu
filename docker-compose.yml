# Запуск обучения VK-LSVD на GPU-инфраструктуре (Yandex Cloud).
#
#   docker compose up --build      # собрать и запустить обучение
#   docker compose down            # остановить (контейнер не перезапускается сам)
#
# Датасет монтируется из ./data (read-only) — в образ он не попадает.
# Результаты обучения (артефакты) и метрики пишутся во внешние каталоги
# ./artifacts и ./results — они остаются на хосте после остановки контейнера.

services:
  train:
    build: .
    image: vk-lsvd-train:latest
    container_name: vk_lsvd_train
    environment:
      - TRAIN_CONFIG=train.config_docker
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data:ro                # датасет (не в образе)
      - ./artifacts:/app/train/artifacts   # результаты обучения -> наружу
      - ./results:/app/train/results       # метрики -> наружу
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: "no"
    stdin_open: false
    tty: false